services:
  - type: web
    name: menaret-al-tawjihi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "منارة التوجيهي"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: tawjihi-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: supabase
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_TIMEZONE
        value: Asia/Gaza
      - key: APP_URL
        value: "https://menaret-al-tawjihi.onrender.com"
      - key: SESSION_LIFETIME
        value: "1440"

databases:
  - name: tawjihi-db
    plan: free
    region: frankfurt
    databaseName: tawjihi
    user: tawjihi_user
