<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with App Icon Squircle Rounded Corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Golden Aura Glow -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Graduation Cap Top (Tawjihi Beacon) -->
  <path d="M 256 90 L 380 150 L 256 200 L 132 150 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 380 150 L 380 200 Q 380 220 370 230" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <circle cx="370" cy="235" r="7" fill="url(#goldGrad)" />

  <!-- Lighthouse Central Tower -->
  <!-- Dome / Lantern Room -->
  <path d="M 230 205 L 282 205 L 276 175 Q 256 160 236 175 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <rect x="235" y="205" width="42" height="35" rx="4" fill="#ffffff" opacity="0.9" filter="url(#glow)" />

  <!-- Lighthouse Rays of Light -->
  <polygon points="278,215 450,150 450,195" fill="url(#goldGrad)" opacity="0.45" filter="url(#glow)" />
  <polygon points="278,225 450,230 450,265" fill="url(#goldGrad)" opacity="0.35" filter="url(#glow)" />

  <!-- Lighthouse Body Structure -->
  <path d="M 226 245 L 286 245 L 298 350 L 214 350 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Windows -->
  <rect x="246" y="260" width="20" height="26" rx="10" fill="url(#goldGrad)" />
  <rect x="244" y="302" width="24" height="32" rx="12" fill="url(#goldGrad)" />

  <!-- Base Curved Laurel Arc -->
  <path d="M 140 330 Q 256 420 372 330" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Alexandria', sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">STEPVORO</text>
  <text x="256" y="455" font-family="'Alexandria', sans-serif" font-weight="700" font-size="20" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">منارة التوجيهي</text>
</svg>
